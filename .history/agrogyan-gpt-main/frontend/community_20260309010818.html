<!DOCTYPE html>
<html>
<head>
    <title>Farmer Community</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌾 Farmer Community</h1>

<div class="post-box">
    <textarea id="postContent" placeholder="Ask something to the community..."></textarea>
    <button onclick="createPost()">Post</button>
</div>

<hr>

<div id="postsContainer"></div>

<script>
const API_URL = "http://127.0.0.1:8000";

async function createPost() {
    const content = document.getElementById("postContent").value;

    const response = await fetch(`${API_URL}/community/create-post`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: content,
            user_id: 1  // For now fixed user
        })
    });

    const data = await response.json();
    if(data.message){
    alert(data.message);
} else {
    alert("Post created!");
}
    loadPosts();
}

async function loadPosts() {
    const response = await fetch(`${API_URL}/community/posts`);
    const posts = await response.json();

    const container = document.getElementById("postsContainer");
    container.innerHTML = "";

    posts.forEach(post => {
        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `
            <p>${post.content}</p>
            <small>Posted at: ${post.timestamp}</small>
            <hr>
        `;
        container.appendChild(div);
    });
}

loadPosts();
</script>

</body>
</html>
