<!DOCTYPE html>
<html>
<head>
<title>Farmer Community</title>
<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial;
background:#f3f6f4;
margin:0;
}

.header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
}

.container{
width:700px;
margin:auto;
margin-top:20px;
}

.post-box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:80px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2e7d32;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:8px;
}

.post{
background:white;
margin-top:20px;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 6px rgba(0,0,0,0.1);
}

.actions{
margin-top:10px;
}

.actions button{
background:#eee;
color:black;
margin-right:5px;
}

.comment-box{
margin-top:10px;
}

.comment{
background:#f0f0f0;
padding:6px;
margin-top:5px;
border-radius:5px;
}
</style>

</head>

<body>

<div class="header">
<h2>🌾 Farmer Community</h2>
</div>

<div class="container">

<div class="post-box">

<textarea id="postContent" placeholder="Ask something to the community..."></textarea>

<button onclick="createPost()">Post</button>

</div>

<div id="postsContainer"></div>

</div>


<script>

let posts=[];

function createPost(){

let content=document.getElementById("postContent").value;

if(content.trim()==""){
alert("Write something first");
return;
}

let post={
content:content,
likes:0,
dislikes:0,
comments:[]
};

posts.unshift(post);

document.getElementById("postContent").value="";

renderPosts();

}

function renderPosts(){

let container=document.getElementById("postsContainer");

container.innerHTML="";

posts.forEach((post,index)=>{

let postDiv=document.createElement("div");
postDiv.className="post";

let commentsHTML="";

post.comments.forEach(c=>{
commentsHTML+=`<div class="comment">${c}</div>`;
});

postDiv.innerHTML=`

<p>${post.content}</p>

<div class="actions">

<button onclick="likePost(${index})">👍 ${post.likes}</button>

<button onclick="dislikePost(${index})">👎 ${post.dislikes}</button>

</div>

<div class="comment-box">

<input type="text" id="comment-${index}" placeholder="Write comment">

<button onclick="addComment(${index})">Reply</button>

${commentsHTML}

</div>

`;

container.appendChild(postDiv);

});

}

function likePost(index){
posts[index].likes++;
renderPosts();
}

function dislikePost(index){
posts[index].dislikes++;
renderPosts();
}

function addComment(index){

let input=document.getElementById(`comment-${index}`);

if(input.value.trim()=="") return;

posts[index].comments.push(input.value);

renderPosts();

}

</script>

</body>
</html>
