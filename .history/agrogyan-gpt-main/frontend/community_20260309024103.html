<!DOCTYPE html>
<html>
<head>
<title>Farmer Community</title>

<style>

body{
font-family:Arial;
background:#f2f6f4;
margin:0;
}

.header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
width:700px;
margin:auto;
margin-top:20px;
}

.post-box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:80px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2e7d32;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:8px;
}

.post{
background:white;
margin-top:20px;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 6px rgba(0,0,0,0.1);
}

.timestamp{
font-size:12px;
color:gray;
}

.actions button{
background:#eee;
color:black;
margin-right:5px;
}

.comment-box{
margin-top:10px;
}

</style>

</head>

<body>

<div class="header">
🌾 Farmer Community
</div>

<div class="container">

<div class="post-box">

<textarea id="postContent"
placeholder="Ask something to the community..."></textarea>

<button onclick="createPost()">Post</button>

</div>

<div id="postsContainer"></div>

</div>


<script>

const API="http://127.0.0.1:8000";


async function createPost(){

let content=document.getElementById("postContent").value;

if(content.trim()==""){
alert("Write something first");
return;
}

await fetch(API+"/community/create-post",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
content:content,
user_id:1
})

});

document.getElementById("postContent").value="";

loadPosts();

}



async function loadPosts(){

let res=await fetch(API+"/community/posts");

let posts=await res.json();

let container=document.getElementById("postsContainer");

container.innerHTML="";

for(let post of posts){

let commentRes=await fetch(API+"/community/comments/"+post.id);

let comments=await commentRes.json();

let div=document.createElement("div");

div.className="post";

div.innerHTML=`

<p>${post.content}</p>

<div class="timestamp">

${new Date(post.timestamp).toLocaleString('en-IN')}

</div>

<div class="actions">

<button onclick="likePost(${post.id})">

👍 ${post.likes}

</button>

<button onclick="dislikePost(${post.id})">

👎 ${post.dislikes}

</button>

</div>

<div>

${comments.map(c=>`
<p>💬 ${c.text}</p>
`).join("")}

</div>

<div class="comment-box">

<input id="comment-${post.id}" placeholder="Write a reply">

<button onclick="addComment(${post.id})">Reply</button>

</div>

`;

container.appendChild(div);

}

}



async function likePost(id){

await fetch(API+"/community/like/"+id,{
method:"POST"
});

loadPosts();

}



async function dislikePost(id){

await fetch(API+"/community/dislike/"+id,{
method:"POST"
});

loadPosts();

}



async function addComment(postId){

let text=document.getElementById("comment-"+postId).value;

await fetch(API+"/community/comment",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
post_id:postId,
text:text
})

});

loadPosts();

}


loadPosts();

</script>

</body>
</html>
