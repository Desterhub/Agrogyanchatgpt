<!DOCTYPE html>
<html>

<head>
<title>Farmer Community</title>

<style>

body{
font-family:Arial;
background:#f2f6f4;
margin:0;
}

.header{
background:#2e7d32;
color:white;
padding:15px;
text-align:center;
}

.container{
width:700px;
margin:auto;
margin-top:20px;
}

.post-box{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:80px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#2e7d32;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:8px;
}

.post{
background:white;
margin-top:20px;
padding:15px;
border-radius:10px;
box-shadow:0px 2px 6px rgba(0,0,0,0.1);
}

.actions button{
background:#eee;
color:black;
margin-right:5px;
}

.timestamp{
font-size:12px;
color:gray;
margin-top:5px;
}

.comment{
background:#f0f0f0;
padding:6px;
margin-top:5px;
border-radius:5px;
}

</style>
</head>


<body>

<div class="header">
  <div class="header-top">
    <h2>🌾 Farmer Community</h2>
    <div class="nav-buttons">
      <button onclick="goHome()">Home</button>
      <button id="loginBtn" onclick="goLogin()">Login</button>
      <button id="logoutBtn" onclick="logoff()">Logoff</button>
    </div>
  </div>
</div>


<div class="container">

<div class="post-box">

<textarea id="postContent" placeholder="Ask something to the community..."></textarea>

<button onclick="createPost()">Post</button>

</div>

<div id="postsContainer"></div>

</div>


<script>

const API="http://127.0.0.1:8000";


async function createPost(){

let content=document.getElementById("postContent").value;

if(content.trim()==""){
alert("Write something first");
return;
}

await fetch(API+"/community/create-post",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
content:content,
user_id:1
})
});

document.getElementById("postContent").value="";

loadPosts();

}


async function loadPosts(){

let res=await fetch(API+"/community/posts");

let posts=await res.json();

let container=document.getElementById("postsContainer");

container.innerHTML="";

for(let post of posts){

let commentRes=await fetch(API+"/community/comments/"+post.id);
let comments=await commentRes.json();

let postDiv=document.createElement("div");

postDiv.className="post";

postDiv.innerHTML=`

<p>${post.content}</p>

<div class="timestamp">
${new Date(post.timestamp).toLocaleString()}
</div>

<div class="actions">

<button onclick="likePost(${post.id})">
👍 ${post.likes || 0}
</button>

<button onclick="dislikePost(${post.id})">
👎 ${post.dislikes || 0}
</button>

</div>

<div>

<input type="text" id="comment-${post.id}" placeholder="Write reply">

<button onclick="addComment(${post.id})">
Reply
</button>

</div>

<div id="comments-${post.id}">
${comments.map(c=>`<div class="comment">${c.text}</div>`).join("")}
</div>

`;

container.appendChild(postDiv);

}

}



async function likePost(id){

await fetch(API+"/community/like/"+id,{
method:"POST"
});

loadPosts();
}


async function dislikePost(id){

await fetch(API+"/community/dislike/"+id,{
method:"POST"
});

loadPosts();
}


async function addComment(id){

let text=document.getElementById("comment-"+id).value;

if(text.trim()=="") return;

await fetch(API+"/community/comment",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
post_id:id,
text:text
})
});

loadPosts();
}

loadPosts();

</script>

</body>
</html>
