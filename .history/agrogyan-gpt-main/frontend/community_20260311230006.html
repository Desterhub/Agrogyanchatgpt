<!DOCTYPE html>
<html>

<head>
<title>Farmer Community</title>

<link rel="stylesheet" href="style.css">

<style>
    /* Community page tweaks (extends base styles in style.css) */
    .community-container {
        max-width: 860px;
        margin: 26px auto 64px;
        padding: 0 16px;
    }

    .post-box {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .post-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
    }

    .post-card {
        background: rgba(255, 255, 255, 0.95);
        padding: 18px;
        border-radius: 18px;
        margin-bottom: 18px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(47, 122, 62, 0.12);
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        opacity: 0;
        animation: fadeInUp 0.34s forwards;
    }

    .post-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.15);
    }

    .post-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
    }

    .post-meta {
        font-size: 13px;
        color: #536e55;
        white-space: nowrap;
    }

    .post-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    .post-actions button {
        background: rgba(47, 122, 62, 0.1);
        border: 1px solid rgba(47, 122, 62, 0.25);
        color: #2f7a3e;
        padding: 8px 14px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .post-actions button:hover {
        background: rgba(47, 122, 62, 0.18);
        transform: translateY(-1px);
    }

    .comment {
        background: rgba(47, 122, 62, 0.08);
        border: 1px solid rgba(47, 122, 62, 0.12);
        padding: 10px 12px;
        border-radius: 12px;
        margin-top: 10px;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 640px) {
        .top-bar {
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .top-actions {
            width: 100%;
            justify-content: center;
        }

        .community-container {
            padding: 0 14px;
        }

        .post-card {
            padding: 14px;
        }

        .post-actions {
            flex-direction: column;
            align-items: stretch;
        }

        .post-actions button {
            width: 100%;
        }
    }
</style>
</head>


<body>

<header class="top-bar">
    <div class="brand-left">
        🌾 Farmer Community
        <div id="welcomeUser" class="welcome-text"></div>
    </div>

    <div class="top-actions">
        <button class="nav-btn" onclick="goHome()">Home</button>
        <button id="authButton" class="nav-btn"></button>
    </div>
</header>


<div class="container">

<div class="post-box">

<textarea id="postContent" placeholder="Ask something to the community..."></textarea>

<button onclick="createPost()">Post</button>

</div>

<div id="postsContainer"></div>

</div>


<script>

const API="http://127.0.0.1:8000";


async function createPost(){

let content=document.getElementById("postContent").value;

if(content.trim()==""){
alert("Write something first");
return;
}

await fetch(API+"/community/create-post",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
content:content,
user_id:1
})
});

document.getElementById("postContent").value="";

loadPosts();

}


async function loadPosts(){

let res=await fetch(API+"/community/posts");

let posts=await res.json();

let container=document.getElementById("postsContainer");

container.innerHTML="";

for(let post of posts){

let commentRes=await fetch(API+"/community/comments/"+post.id);
let comments=await commentRes.json();

let postDiv=document.createElement("div");

postDiv.className="post";

postDiv.innerHTML=`

<p>${post.content}</p>

<div class="timestamp">
${new Date(post.timestamp).toLocaleString()}
</div>

<div class="actions">

<button onclick="likePost(${post.id})">
👍 ${post.likes || 0}
</button>

<button onclick="dislikePost(${post.id})">
👎 ${post.dislikes || 0}
</button>

</div>

<div>

<input type="text" id="comment-${post.id}" placeholder="Write reply">

<button onclick="addComment(${post.id})">
Reply
</button>

</div>

<div id="comments-${post.id}">
${comments.map(c=>`<div class="comment">${c.text}</div>`).join("")}
</div>

`;

container.appendChild(postDiv);

}

}



async function likePost(id){

await fetch(API+"/community/like/"+id,{
method:"POST"
});

loadPosts();
}


async function dislikePost(id){

await fetch(API+"/community/dislike/"+id,{
method:"POST"
});

loadPosts();
}


async function addComment(id){

let text=document.getElementById("comment-"+id).value;

if(text.trim()=="") return;

await fetch(API+"/community/comment",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
post_id:id,
text:text
})
});

loadPosts();
}

function updateAuthButtons() {
    const user = localStorage.getItem("user");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
    } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
    }
}

function goHome() {
    window.location.href = "index.html";
}

function goLogin() {
    window.location.href = "login.html";
}

function logoff() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

updateAuthButtons();
loadPosts();

</script>

</body>
</html>
