<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Community</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Community page tweaks (extends base styles in style.css) */
        .community-container {
            max-width: 860px;
            margin: 26px auto 64px;
            padding: 0 16px;
        }

        .post-box {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
        }

        .post-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 18px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(47, 122, 62, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            opacity: 0;
            animation: fadeInUp 0.34s forwards;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.15);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
        }

        .post-meta {
            font-size: 13px;
            color: #536e55;
            white-space: nowrap;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .post-actions button {
            background: rgba(47, 122, 62, 0.1);
            border: 1px solid rgba(47, 122, 62, 0.25);
            color: #2f7a3e;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .post-actions button:hover {
            background: rgba(47, 122, 62, 0.18);
            transform: translateY(-1px);
        }

        .comment {
            background: rgba(47, 122, 62, 0.08);
            border: 1px solid rgba(47, 122, 62, 0.12);
            padding: 10px 12px;
            border-radius: 12px;
            margin-top: 10px;
        }

        /* loading skeleton */
        .skeleton {
            position: relative;
            overflow: hidden;
            opacity: 0.9;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 120%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: shimmer 1.3s infinite;
        }

        .skeleton-line {
            background: rgba(230, 230, 230, 0.9);
            border-radius: 10px;
            height: 14px;
            margin-bottom: 10px;
        }

        .skeleton-title {
            width: 60%;
            height: 18px;
        }

        .skeleton-meta {
            width: 35%;
            height: 12px;
        }

        .skeleton-text {
            width: 100%;
        }

        .skeleton-action {
            width: 52%;
            height: 32px;
        }

        @keyframes shimmer {
            from {
                transform: translateX(-120%);
            }
            to {
                transform: translateX(120%);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .top-bar {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }

            .top-actions {
                width: 100%;
                justify-content: center;
            }

            .community-container {
                padding: 0 14px;
            }

            .post-card {
                padding: 14px;
            }

            .post-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .post-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="top-bar">
    <div class="brand-left">
        🌾 Farmer Community
        <div id="welcomeUser" class="welcome-text"></div>
    </div>

    <div class="top-actions">
        <button id="themeButton" class="nav-btn" onclick="toggleTheme()">🌙</button>
        <button class="nav-btn" onclick="goHome()">Home</button>
        <button id="authButton" class="nav-btn"></button>
    </div>
</header>

<div id="toast" class="toast"></div>

<div id="tourOverlay" class="tour-overlay hidden">
    <div class="tour-card">
        <div class="tour-step" id="tourStep">
            <h3 id="tourTitle">Welcome!</h3>
            <p id="tourText">Let's walk through the community features.</p>
            <div class="tour-buttons">
                <button id="tourNext" class="primary-btn">Next</button>
                <button id="tourSkip" class="nav-btn">Skip</button>
            </div>
        </div>
    </div>
</div>

<main class="community-container">
    <section class="post-box">
        <textarea id="postContent" placeholder="Ask something to the community..."></textarea>
        <button class="primary-btn" onclick="createPost()">Post</button>
    </section>

    <section class="search-bar" style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <input id="postSearch" placeholder="Search community posts..." style="flex:1; padding:10px; border-radius:12px; border:1px solid rgba(0,0,0,0.18);" />
        <button class="primary-btn" onclick="searchPosts()">Search</button>
    </section>

    <div id="postsContainer"></div>

    <div id="loadMoreWrapper" style="text-align:center; margin-top: 18px;">
        <button id="loadMoreBtn" class="primary-btn" onclick="loadMorePosts()">Load more</button>
    </div>
</main>

<div class="mobile-actions">
    <button class="nav-btn" onclick="createPost()">+ New post</button>
    <button class="nav-btn" onclick="loadPosts({ reset: true })">↻ Refresh</button>
</div>

<script>
const API = "http://127.0.0.1:8000";
const PAGE_SIZE = 6;

let postOffset = 0;
let currentSearch = "";
let currentUserId = null;

function setTheme(theme) {
    document.body.classList.toggle("dark-mode", theme === "dark");
    localStorage.setItem("theme", theme);
    const themeButton = document.getElementById("themeButton");
    if (themeButton) {
        themeButton.innerText = theme === "dark" ? "☀️" : "🌙";
    }
}

function toggleTheme() {
    const active = document.body.classList.contains("dark-mode") ? "dark" : "light";
    setTheme(active === "dark" ? "light" : "dark");
}

function showToast(message, type = "success", duration = 3200) {
    const toast = document.getElementById("toast");
    if (!toast) return;

    toast.className = `toast show ${type}`;
    toast.innerText = message;

    clearTimeout(toast.dismissId);
    toast.dismissId = setTimeout(() => {
        toast.className = "toast";
    }, duration);
}

const tourSteps = [
    {
        title: "Welcome to your community",
        text: "This is the place to share ideas, ask questions, and help other farmers. Let us show you around.",
    },
    {
        title: "Create a post",
        text: "Start a discussion by typing in the box at the top and tapping Post. Your fellow farmers will see it instantly.",
    },
    {
        title: "React & reply",
        text: "Use emoji reactions or reply to posts to keep the conversation going. You can even edit or delete your own posts.",
    },
    {
        title: "Search & explore",
        text: "Use the search box to quickly find posts, and tap Load more to see older discussions.",
    },
];

let tourStepIndex = 0;

function showTourStep(index) {
    const overlay = document.getElementById("tourOverlay");
    const title = document.getElementById("tourTitle");
    const text = document.getElementById("tourText");

    if (!overlay || !title || !text) return;

    const step = tourSteps[index];
    if (!step) {
        endTour();
        return;
    }

    title.innerText = step.title;
    text.innerText = step.text;
    overlay.classList.remove("hidden");
}

function nextTourStep() {
    tourStepIndex += 1;
    if (tourStepIndex >= tourSteps.length) {
        endTour();
        return;
    }
    showTourStep(tourStepIndex);
}

function endTour() {
    const overlay = document.getElementById("tourOverlay");
    if (overlay) {
        overlay.classList.add("hidden");
    }
    localStorage.setItem("communityTourSeen", "1");
}

function maybeStartTour() {
    if (localStorage.getItem("communityTourSeen")) return;
    tourStepIndex = 0;
    showTourStep(0);
}

function showLoadingSkeleton(count = 3) {
    const container = document.getElementById("postsContainer");
    container.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const card = document.createElement("div");
        card.className = "post-card skeleton";
        card.innerHTML = `
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-text"></div>
            <div class="skeleton-line skeleton-text"></div>
            <div class="skeleton-line skeleton-action"></div>
        `;
        container.appendChild(card);
    }
}

function scrollToLatestPost() {
    const container = document.getElementById("postsContainer");
    const last = container.lastElementChild;
    if (last) {
        last.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

async function createPost() {
    const content = document.getElementById("postContent").value.trim();
    if (!content) {
        alert("Write something first");
        return;
    }

    try {
        await fetch(API + "/community/create-post", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content, user_id: currentUserId || 1 })
        });
        document.getElementById("postContent").value = "";
        await loadPosts({ reset: true });
        scrollToLatestPost();
        showToast("Posted! Your post is now live.");
    } catch (err) {
        showToast("Unable to post. Check your backend.", "error");
        console.error("createPost error", err);
    }
}

async function loadPosts({ reset = true } = {}) {
    if (reset) {
        postOffset = 0;
    }

    const container = document.getElementById("postsContainer");

    if (reset) {
        container.innerHTML = "";
    }

    showLoadingSkeleton();

    const params = new URLSearchParams({
        limit: PAGE_SIZE.toString(),
        offset: postOffset.toString()
    });
    if (currentSearch) {
        params.set("search", currentSearch);
    }

    let posts = [];
    try {
        const res = await fetch(API + "/community/posts?" + params.toString());
        posts = await res.json();
    } catch (err) {
        showToast("Unable to load posts. Is the backend running?", "error");
        console.error("loadPosts error", err);
        container.innerHTML = "<div style='padding: 18px; color:#333;'>Could not load posts. Please check your server.</div>";
        return;
    }

    if (reset) {
        container.innerHTML = "";
    }

    if (reset && posts.length === 0) {
        showToast("No posts yet — be the first to share!", "error");
    }

    for (const post of posts) {
        const commentRes = await fetch(API + "/community/comments/" + post.id);
        const comments = await commentRes.json();

        const postDiv = document.createElement("div");
        postDiv.className = "post-card";

        const reactionButtons = ["❤️", "😂", "😮", "😢", "😡"].map((emoji) => {
            const count = (post.reactions && post.reactions[emoji]) || 0;
            return `<button onclick="addReaction(${post.id}, '${emoji}')">${emoji} ${count}</button>`;
        }).join("");

        const isOwner = post.user_id && currentUserId && String(post.user_id) === String(currentUserId);
        const ownerActions = isOwner ? `
            <button onclick="editPost(${post.id})">✏️</button>
            <button onclick="deletePost(${post.id})">🗑️</button>
        ` : "";

        postDiv.innerHTML = `
            <div class="post-header">
                <div>
                    <div class="post-content" id="post-content-${post.id}">${post.content}</div>
                    <div class="post-meta">Posted by <strong>${post.user_name || "Anonymous"}</strong> • ${new Date(post.timestamp).toLocaleString()}</div>
                </div>
            </div>

            <div class="post-actions">
                <button onclick="likePost(${post.id})">👍 ${post.likes || 0}</button>
                <button onclick="dislikePost(${post.id})">👎 ${post.dislikes || 0}</button>
                ${reactionButtons}
                ${ownerActions}
            </div>

            <div class="comment" style="margin-top: 14px;">
                <input type="text" id="comment-${post.id}" placeholder="Write reply" />
                <button class="primary-btn" style="margin-top: 10px;" onclick="addComment(${post.id})">Reply</button>
            </div>

            <div id="comments-${post.id}">
                ${comments.map(c => `<div class="comment"><strong>${c.user_name || 'Guest'}:</strong> ${c.text}</div>`).join("")}
            </div>
        `;

        container.appendChild(postDiv);
    }

    const loadMoreBtn = document.getElementById("loadMoreBtn");
    if (loadMoreBtn) {
        loadMoreBtn.style.display = posts.length < PAGE_SIZE ? "none" : "inline-block";
    }
}

async function loadMorePosts() {
    postOffset += PAGE_SIZE;
    await loadPosts({ reset: false });
}

async function searchPosts() {
    currentSearch = document.getElementById("postSearch").value.trim();
    await loadPosts({ reset: true });
}

async function addReaction(postId, emoji) {
    await fetch(API + "/community/react", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ post_id: postId, emoji })
    });

    showToast(`Reacted with ${emoji}`);
    loadPosts({ reset: false });
}

async function likePost(id) {
    await fetch(API + "/community/like/" + id, { method: "POST" });
    showToast("Liked 👍");
    loadPosts({ reset: false });
}

async function dislikePost(id) {
    await fetch(API + "/community/dislike/" + id, { method: "POST" });
    showToast("Disliked 👎", "error");
    loadPosts({ reset: false });
}

async function addComment(id) {
    const text = document.getElementById("comment-" + id).value.trim();
    if (!text) return;

    try {
        await fetch(API + "/community/comment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ post_id: id, user_id: currentUserId || 1, text })
        });

        showToast("Replied to the post.");
        loadPosts({ reset: false });
        scrollToLatestPost();
    } catch (err) {
        showToast("Unable to add comment. Check your backend.", "error");
        console.error("addComment error", err);
    }
}

async function editPost(postId) {
    const current = document.getElementById(`post-content-${postId}`)?.innerText || "";
    const updated = prompt("Edit your post:", current);
    if (updated === null || updated.trim() === "") return;

    await fetch(API + "/community/post", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ post_id: postId, user_id: currentUserId, content: updated })
    });

    loadPosts({ reset: true });
    showToast("Post updated!");
}

async function deletePost(postId) {
    if (!confirm("Delete this post?")) return;

    await fetch(API + "/community/post", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ post_id: postId, user_id: currentUserId })
    });

    loadPosts({ reset: true });
    showToast("Post removed.", "error");
}

function updateAuthButtons() {
    const user = localStorage.getItem("user");
    currentUserId = parseInt(localStorage.getItem("userId"), 10) || null;

    const authButton = document.getElementById("authButton");
    const welcomeUser = document.getElementById("welcomeUser");

    if (user) {
        welcomeUser.innerText = "Hi " + user;
        authButton.innerText = "Logout";
        authButton.onclick = () => {
            localStorage.removeItem("user");
            localStorage.removeItem("userId");
            window.location.href = "login.html";
        };
    } else {
        welcomeUser.innerText = "";
        authButton.innerText = "Login";
        authButton.onclick = () => {
            window.location.href = "login.html";
        };
    }
}

function goHome() {
    window.location.href = "index.html";
}

// Initialize page
setTheme(localStorage.getItem("theme") || "light");
updateAuthButtons();
loadPosts({ reset: true }).then(() => maybeStartTour());

const tourNextBtn = document.getElementById("tourNext");
const tourSkipBtn = document.getElementById("tourSkip");
if (tourNextBtn) tourNextBtn.addEventListener("click", nextTourStep);
if (tourSkipBtn) tourSkipBtn.addEventListener("click", endTour);
</script>

</body>
</html>
