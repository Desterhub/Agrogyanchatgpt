<!DOCTYPE html>
<html>
<head>
    <title>Farmer Community</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🌾 Farmer Community</h1>

<div class="post-box">
    <textarea id="postContent" rows="3" placeholder="Ask something to the community..."></textarea>
    <button onclick="createPost()">Post</button>
</div>

<div id="postsContainer"></div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000";

async function createPost() {

    const content = document.getElementById("postContent").value;

    if(content.trim() === ""){
        alert("Write something first!");
        return;
    }

    const response = await fetch(`${API_URL}/community/create-post`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: content,
            user_id: 1
        })
    });

    document.getElementById("postContent").value = "";

    loadPosts();
}

async function loadPosts() {

    const response = await fetch(`${API_URL}/community/posts`);
    const posts = await response.json();

    const container = document.getElementById("postsContainer");

    container.innerHTML = "";

    posts.reverse().forEach(post => {

        const div = document.createElement("div");

        div.className = "post-card";

        div.innerHTML = `
            <div class="post-header">
                👨‍🌾 Farmer
                <span>${new Date(post.timestamp).toLocaleString()}</span>
            </div>

            <div class="post-content">
                ${post.content}
            </div>

            <div class="post-actions">
                👍 Like
                💬 Comment
                🔗 Share
            </div>
        `;

        container.appendChild(div);
    });
}

loadPosts();

</script>

</body>
</html>
