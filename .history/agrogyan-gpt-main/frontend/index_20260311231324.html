<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgroGyanGPT</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>

<div id="welcomeOverlay" class="welcome-overlay">
    <div class="welcome-card">
        <h1>Welcome to AgroGyanGPT</h1>
        <p>Harvest answers from trusted agricultural knowledge.</p>
    </div>
</div>

<header class="top-bar">
    <div class="brand-left">
        🌱 AgroGyanGPT
        <div id="welcomeUser" class="welcome-text"></div>
    </div>

    <div class="top-actions">
        <button class="nav-btn" onclick="goToCommunity()">
            👨‍🌾 Connect Farmers
        </button>
        <button id="authButton" class="nav-btn login-btn"></button>
    </div>
</header>

<section class="hero">
    <h1 class="main-title">AgroGyanGPT</h1>
    <p class="subtitle">Your Smart Agricultural Assistant</p>
    <p class="subnote">Answers strictly from verified uploaded documents</p>
</section>

<div class="chat-container">

    <textarea 
        id="question" 
        placeholder="Type or speak your agriculture question..."
    ></textarea>

    <div class="image-upload">
        <input type="file" id="imageInput" accept="image/*">
        <button class="icon-btn" onclick="uploadImage()">📷</button>
    </div>

    <div class="controls">

        <div class="left-controls">
            <button class="primary-btn" onclick="askQuestion()">
                Ask
            </button>

            <button class="icon-btn" onclick="startListening()" title="Speak">
                🎤
            </button>
        </div>

        <div class="right-controls">
            <select id="language">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Marathi">Marathi</option>
            </select>
        </div>

    </div>

    <div class="answer-box">
        <h3>Answer</h3>
        <p id="answer">Waiting for your question...</p>
        <p id="confidence"></p>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const overlay = document.getElementById("welcomeOverlay");
    setTimeout(() => {
        overlay.classList.add("hidden");
        setTimeout(() => overlay.remove(), 400);
    }, 1700);

    const user = localStorage.getItem("user");
    const authButton = document.getElementById("authButton");
    const welcomeUser = document.getElementById("welcomeUser");

    if (user) {
        welcomeUser.innerText = "Hi " + user;
        authButton.innerText = "Logout";
        authButton.onclick = function () {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        };
    } else {
        authButton.innerText = "Login";
        authButton.onclick = function () {
            window.location.href = "login.html";
        };
    }
});

function goToCommunity() {
    const user = localStorage.getItem("user");
    if (user) {
        window.location.href = "community.html";
    } else {
        window.location.href = "login.html";
    }
}
</script>

</body>
</html>
