<!DOCTYPE html>
<html>
<head>
  <title>Login - AgroGyanGPT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-wrapper">

  <div class="login-card">

      <h1 class="login-brand">🌱 AgroGyanGPT</h1>
      <p class="login-subtitle">Secure Access Portal</p>

      <input id="email" type="email" placeholder="Email Address" />
      <input id="password" type="password" placeholder="Password" />

      <button class="login-btn-green" onclick="login()">Login</button>

      <p class="login-switch">
          Not registered? 
          <a href="#" class="register-link" onclick="showRegister(); return false;">Register here</a>
      </p>

      <p id="authMessage"></p>

  </div>

</div>

<script src="auth.js"></script>
</body>
</html>
