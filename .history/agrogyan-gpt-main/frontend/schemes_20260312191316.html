<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Government Schemes</title>
<link rel="stylesheet" href="style.css">

<style>

.scheme-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.scheme-card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:center;
}

.scheme-card h3{
margin-bottom:10px;
}

.scheme-card p{
font-size:14px;
margin-bottom:15px;
}

</style>

</head>

<body>

<header class="top-bar">

    <div class="brand-left">
        🌱 AgroGyanGPT
        <div id="welcomeUser" class="welcome-text"></div>
    </div>

    <div class="top-actions">
        <button class="nav-btn" onclick="goHome()">🏠 Home</button>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>

</header>

<section class="hero">

<h1 class="main-title">Government Schemes</h1>
<p class="subtitle">Explore important agricultural schemes</p>

</section>

<div class="chat-container">

    <div class="scheme-tabs">
        <button class="tab-btn active" data-category="all" onclick="setSchemeTab('all')">All</button>
        <button class="tab-btn" data-category="income" onclick="setSchemeTab('income')">Income</button>
        <button class="tab-btn" data-category="insurance" onclick="setSchemeTab('insurance')">Insurance</button>
        <button class="tab-btn" data-category="loan" onclick="setSchemeTab('loan')">Loans</button>
        <button class="tab-btn" data-category="irrigation" onclick="setSchemeTab('irrigation')">Irrigation</button>
        <button class="tab-btn" data-category="tech" onclick="setSchemeTab('tech')">Tech</button>
        <button class="tab-btn" data-category="favorites" onclick="setSchemeTab('favorites')">★ Favorites</button>
    </div>

    <div id="schemeList" class="scheme-grid"></div>

</div>

<script>

const schemes = [

{ name:"PM-KISAN", category:"income", benefit:"₹6000 yearly support to farmers", link:"https://pmkisan.gov.in" },

{ name:"PM Kisan Maandhan", category:"income", benefit:"Pension scheme for farmers", link:"https://maandhan.in" },

{ name:"PM Fasal Bima Yojana", category:"insurance", benefit:"Crop insurance protection", link:"https://pmfby.gov.in" },

{ name:"Weather Based Crop Insurance", category:"insurance", benefit:"Insurance based on weather conditions", link:"https://pmfby.gov.in"},

{ name:"Kisan Credit Card", category:"loan", benefit:"Low interest credit for farmers", link:"https://www.myscheme.gov.in/schemes/kcc"},

{ name:"Agriculture Infrastructure Fund", category:"loan", benefit:"Loans for agri infrastructure", link:"https://agriinfra.dac.gov.in"}, 

{ name:"PM Krishi Sinchai Yojana", category:"irrigation", benefit:"Improve irrigation facilities", link:"https://pmksy.gov.in"}, 

{ name:"PM-KUSUM", category:"irrigation", benefit:"Solar pumps for agriculture", link:"https://pmkusum.mnre.gov.in"}, 

{ name:"Soil Health Card", category:"tech", benefit:"Know soil nutrients and improve crop productivity", link:"https://soilhealth.dac.gov.in"}, 

{ name:"e-NAM", category:"tech", benefit:"Online agricultural market platform", link:"https://enam.gov.in"}

];

function createCard(scheme){

return `
<div class="scheme-card">
<h3>${scheme.name}</h3>
<p>${scheme.benefit}</p>
<a href="${scheme.link}" target="_blank">
<button class="primary-btn">Apply / Learn More</button>
</a>
</div>
`;

}

schemes.forEach(scheme => {

if(scheme.category==="income")
document.getElementById("incomeSchemes").innerHTML += createCard(scheme)

if(scheme.category==="insurance")
document.getElementById("insuranceSchemes").innerHTML += createCard(scheme)

if(scheme.category==="loan")
document.getElementById("loanSchemes").innerHTML += createCard(scheme)

if(scheme.category==="irrigation")
document.getElementById("irrigationSchemes").innerHTML += createCard(scheme)

if(scheme.category==="tech")
document.getElementById("techSchemes").innerHTML += createCard(scheme)

})

</script>

<script>
// ensure user is logged in and show a welcome name
const currentUser = localStorage.getItem("user");
if (!currentUser) {
    window.location.href = "login.html";
}

const welcomeUser = document.getElementById("welcomeUser");
if (welcomeUser) {
    welcomeUser.innerText = currentUser ? `Hi ${currentUser}` : "";
}

function goHome() {
    window.location.href = "index.html";
}

function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("userId");
    window.location.href = "login.html";
}
</script>

</body>
</html>
