<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Government Schemes</title>
<link rel="stylesheet" href="style.css">
<script defer src="i18n.js"></script>

<style>

.scheme-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.tab-btn {
    background: rgba(47, 122, 62, 0.15);
    border: 1px solid rgba(47, 122, 62, 0.28);
    border-radius: 12px;
    padding: 8px 14px;
    cursor: pointer;
    color: #1f4727;
    font-weight: 600;
    transition: background 0.2s ease, transform 0.2s ease;
}

.tab-btn:hover {
    background: rgba(47, 122, 62, 0.25);
    transform: translateY(-1px);
}

.tab-btn.active {
    background: rgba(47, 122, 62, 0.9);
    color: #fff;
    border-color: rgba(47, 122, 62, 0.9);
}

.scheme-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.scheme-card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:left;
position:relative;
}

.scheme-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.scheme-card h3{
margin: 0;
font-size: 16px;
}

.scheme-card p{
font-size:14px;
margin-bottom:15px;
}

.scheme-actions {
    display: flex;
    justify-content: flex-start;
}

.favorite-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #2f7a3e;
    padding: 0;
}

.favorite-btn:hover {
    transform: scale(1.1);
}

</style>

</head>

<body>

<header class="top-bar">

    <div class="brand-left" data-i18n="appName">
        🌱 AgroGyanGPT
        <div id="welcomeUser" class="welcome-text"></div>
    </div>

    <div class="top-actions">
        <select id="uiLanguage" class="lang-select" aria-label="UI Language">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
        </select>
        <button class="nav-btn" onclick="goHome()" data-i18n="home">🏠 Home</button>
        <button class="nav-btn" onclick="goToCommunity()" data-i18n="connectFarmers">👨‍🌾 Community</button>
        <button class="nav-btn" onclick="goToProfile()" data-i18n="profile">👤 Profile</button>
        <button class="nav-btn" onclick="logout()" data-i18n="logout">Logout</button>
    </div>

</header>

<section class="hero">

<h1 class="main-title" data-i18n="schemes">Government Schemes</h1>
<p class="subtitle" data-i18n="schemesSubtitle">Explore important agricultural schemes</p>

</section>

<div class="chat-container">

    <div class="scheme-tabs">
        <button class="tab-btn active" data-category="all" onclick="setSchemeTab('all')" data-i18n="tabAll">All</button>
        <button class="tab-btn" data-category="income" onclick="setSchemeTab('income')" data-i18n="tabIncome">Income</button>
        <button class="tab-btn" data-category="insurance" onclick="setSchemeTab('insurance')" data-i18n="tabInsurance">Insurance</button>
        <button class="tab-btn" data-category="loan" onclick="setSchemeTab('loan')" data-i18n="tabLoans">Loans</button>
        <button class="tab-btn" data-category="irrigation" onclick="setSchemeTab('irrigation')" data-i18n="tabIrrigation">Irrigation</button>
        <button class="tab-btn" data-category="tech" onclick="setSchemeTab('tech')" data-i18n="tabTech">Tech</button>
        <button class="tab-btn" data-category="favorites" onclick="setSchemeTab('favorites')" data-i18n="tabFavorites">★ Favorites</button>
    </div>

    <div id="schemeList" class="scheme-grid"></div>

</div>

<script>

const schemes = [

{ name:"PM-KISAN", category:"income", benefit:"₹6000 yearly support to farmers", link:"https://pmkisan.gov.in" },

{ name:"PM Kisan Maandhan", category:"income", benefit:"Pension scheme for farmers", link:"https://maandhan.in" },

{ name:"PM Fasal Bima Yojana", category:"insurance", benefit:"Crop insurance protection", link:"https://pmfby.gov.in" },

{ name:"Weather Based Crop Insurance", category:"insurance", benefit:"Insurance based on weather conditions", link:"https://pmfby.gov.in"},

{ name:"Kisan Credit Card", category:"loan", benefit:"Low interest credit for farmers", link:"https://www.myscheme.gov.in/schemes/kcc"},

{ name:"Agriculture Infrastructure Fund", category:"loan", benefit:"Loans for agri infrastructure", link:"https://agriinfra.dac.gov.in"}, 

{ name:"PM Krishi Sinchai Yojana", category:"irrigation", benefit:"Improve irrigation facilities", link:"https://pmksy.gov.in"}, 

{ name:"PM-KUSUM", category:"irrigation", benefit:"Solar pumps for agriculture", link:"https://pmkusum.mnre.gov.in"}, 

{ name:"Soil Health Card", category:"tech", benefit:"Know soil nutrients and improve crop productivity", link:"https://soilhealth.dac.gov.in"}, 

{ name:"e-NAM", category:"tech", benefit:"Online agricultural market platform", link:"https://enam.gov.in"}

];

function getFavoriteSchemes() {
    return JSON.parse(localStorage.getItem("favoriteSchemes") || "[]");
}

function toggleFavorite(schemeName) {
    const current = getFavoriteSchemes();
    const index = current.indexOf(schemeName);
    if (index >= 0) {
        current.splice(index, 1);
    } else {
        current.push(schemeName);
    }
    localStorage.setItem("favoriteSchemes", JSON.stringify(current));
    renderSchemes(currentTab);
}

function isFavorite(schemeName) {
    return getFavoriteSchemes().includes(schemeName);
}

let currentTab = "all";

function setSchemeTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-category") === tab);
    });
    renderSchemes(tab);
}

function createCard(scheme) {
    const favorited = isFavorite(scheme.name);

    return `
    <div class="scheme-card">
        <div class="scheme-card-header">
            <h3>${scheme.name}</h3>
            <button class="favorite-btn" aria-label="Toggle favorite" onclick="toggleFavorite('${scheme.name}')">
                ${favorited ? "★" : "☆"}
            </button>
        </div>
        <p>${scheme.benefit}</p>
        <div class="scheme-actions">
            <a href="${scheme.link}" target="_blank">
                <button class="primary-btn">${t("applyLearnMore")}</button>
            </a>
        </div>
    </div>
    `;
}

function renderSchemes(tab) {
    const container = document.getElementById("schemeList");

    let filtered = schemes;
    if (tab && tab !== "all") {
        if (tab === "favorites") {
            const favorites = getFavoriteSchemes();
            filtered = schemes.filter(s => favorites.includes(s.name));
        } else {
            filtered = schemes.filter(s => s.category === tab);
        }
    }

    if (filtered.length === 0) {
        container.innerHTML = `<p style="color: rgba(27,61,31,0.7);">No schemes found for this category.</p>`;
        return;
    }

    container.innerHTML = filtered.map(createCard).join("");
}

// Init
renderSchemes(currentTab);


</script>

<script>
// ensure user is logged in and show a welcome name
const currentUser = localStorage.getItem("user");
if (!currentUser) {
    window.location.href = "login.html";
}

const welcomeUser = document.getElementById("welcomeUser");
if (welcomeUser) {
    welcomeUser.innerText = currentUser ? t("welcomeUserPrefix") + currentUser : "";
}

function goHome() {
    window.location.href = "index.html";
}

function logout() {
    if (confirm(t("confirmLogout"))) {
        localStorage.removeItem("user");
        localStorage.removeItem("userId");
        window.location.href = "login.html";
    }
}
</script>

</body>
</html>
