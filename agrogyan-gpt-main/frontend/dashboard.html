<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - AgroGyanGPT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
  if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
  }
</script>

<div class="top-bar">
  <div style="color:white;">Welcome, <span id="userName"></span></div>
  <div>
    <button class="top-btn" onclick="logout()">Logout</button>
  </div>
</div>

<script>
  document.getElementById("userName").innerText =
    localStorage.getItem("user");

  function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  }
</script>

<!-- LOAD YOUR MAIN APP -->
<iframe src="index.html" style="width:100%; height:90vh; border:none;"></iframe>

</body>
</html>
